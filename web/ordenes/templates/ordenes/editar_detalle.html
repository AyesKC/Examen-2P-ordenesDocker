<!DOCTYPE html>
<html>
<head>
    <h1>Editar Detalle</h1>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(to bottom,#0f4c81,#4a90e2);
            min-height:100vh;
            padding:30px;
        }

        .contenedor{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.30);
        }

        h1{
            text-align:center;
            color:#0f4c81;
        }

        button{
            background:#ffc107;
            color:black;
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        a{
            color:#0f4c81;
            text-decoration:none;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

<div class="contenedor">

<h1>Editar Orden</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Actualizar
    </button>

</form>

<br>

<a href="/">
    Volver
</a>

</div>

</body>
</html>
