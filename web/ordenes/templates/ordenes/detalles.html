<!DOCTYPE html>
<html>
<head>
    <title>Detalles</title>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(to bottom,#0f4c81,#4a90e2);
            min-height:100vh;
            padding:30px;
        }

        .contenedor{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.30);
        }

        h1{
            text-align:center;
            color:#0f4c81;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#0f4c81;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        a{
            text-decoration:none;
            border-radius:6px;
            padding:6px 10px;
            color:white;
        }

        .agregar{
            background:#28a745;
        }

        .editar{
            background:#ffc107;
            color:black;
        }

        .eliminar{
            background:#dc3545;
        }

    </style>

</head>

<body>

<div class="contenedor">

<h1>Detalles de la Orden {{ orden_id }}</h1>

<a href="/detalles/{{ orden_id }}/agregar/"
class="agregar">
Agregar Detalle
</a>

<br><br>

<table>

<tr>
    <th>ID</th>
    <th>Producto</th>
    <th>Cantidad</th>
    <th>Precio</th>
    <th>Subtotal</th>
    <th>Acciones</th>
</tr>

{% for detalle in detalles %}

<tr>

    <td>{{ detalle.id }}</td>
    <td>{{ detalle.producto }}</td>
    <td>{{ detalle.cantidad }}</td>
    <td>{{ detalle.precio_unitario }}</td>
    <td>{{ detalle.subtotal }}</td>

    <td>

        <a href="/detalle/editar/{{ detalle.id }}/{{ orden_id }}/"
        class="editar">
        Editar
        </a>

        <a href="/detalle/eliminar/{{ detalle.id }}/{{ orden_id }}/"
        class="eliminar"
        onclick="return confirm('¿Eliminar este detalle?')">
        Eliminar
        </a>

    </td>

</tr>

{% endfor %}

</table>

<br>

<a href="/" style="background:#0f4c81;">
Volver
</a>

</div>

</body>
</html>
