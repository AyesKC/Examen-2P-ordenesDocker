<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Órdenes</title>

    <style>

        body{
            margin:0;
            padding:30px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to bottom,#0f4c81,#4a90e2);
            min-height:100vh;
        }

        .contenedor{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h1{
            color:#0f4c81;
            text-align:center;
        }

        .btn-nuevo{
            background:#28a745;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th{
            background:#0f4c81;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        tr:hover{
            background:#d5e9ff;
        }

        .btn-detalles{
            background:#17a2b8;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            text-decoration:none;
        }

        .btn-editar{
            background:#ffc107;
            color:black;
            padding:6px 10px;
            border-radius:6px;
            text-decoration:none;
        }

        .btn-eliminar{
            background:#dc3545;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="contenedor">

<h1>Sistema de Gestión de Órdenes</h1>

<a href="/crear/" class="btn-nuevo">
    Nueva Orden
</a>

<table>

<tr>
    <th>ID</th>
    <th>Cliente</th>
    <th>Estado</th>
    <th>Total</th>
    <th>Acciones</th>
</tr>

{% for orden in ordenes %}

<tr>

    <td>{{ orden.id }}</td>
    <td>{{ orden.cliente }}</td>
    <td>{{ orden.estado }}</td>
    <td>L. {{ orden.total }}</td>

    <td>

        <a href="/detalles/{{ orden.id }}/"
        class="btn-detalles">
        Detalles
        </a>

        <a href="/editar/{{ orden.id }}/"
        class="btn-editar">
        Editar
        </a>

        <a href="/eliminar/{{ orden.id }}/"
        class="btn-eliminar"
        onclick="return confirm('¿Desea eliminar esta orden?')">
        Eliminar
        </a>

    </td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
